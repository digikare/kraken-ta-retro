<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kraken ta rétro</title>
<link rel="icon" href="/digikare-favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/digikare-favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/digikare-icon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/digikare-icon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/digikare-icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/digikare-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#282E3A;--green:#30C5A7;--green-dark:#1FA98C;--pink:#FF0066;--line:#E3E9EC;
 --bg:#F7FAF9;--muted:#5A6472;--soft:#8A97A0;--green-pale:#EAF9F4;--pink-pale:#FFF0F5}
*{box-sizing:border-box;margin:0}
body{font:15px/1.55 'Montserrat',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.sp{flex:1}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px rgba(40,46,58,.06)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);
 font-weight:700;font-size:13px;padding:8px 14px;border-radius:10px;transition:background .15s,color .15s,border-color .15s,opacity .15s;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:hover{background:var(--green-dark);border-color:var(--green-dark)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:#1B202A}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.danger:hover{background:#D60058}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:8px}
.btn.icon{padding:8px}
.btn:disabled{opacity:.35;pointer-events:none}
#err{position:fixed;top:0;left:0;right:0;z-index:400;background:var(--pink);color:#fff;padding:10px 16px;font-size:13px;display:none;font-family:ui-monospace,monospace;cursor:pointer}
/* ---- accueil ---- */
.landing{max-width:980px;margin:0 auto;padding:6vh 20px 70px;display:flex;flex-direction:column;align-items:center}
.landing .logo{margin-bottom:14px}
.landing h1{font-size:clamp(34px,5vw,56px);font-weight:800;letter-spacing:-.01em;text-align:center}
.landing h1 em{color:var(--green);font-style:normal}
.lede{max-width:560px;text-align:center;color:var(--muted);margin:10px 0 0;font-weight:500}
.svgband{border:1px solid var(--line);border-radius:14px;background:#fff;margin-top:22px;width:100%}
.svgband svg{display:block;width:100%;height:auto}
.boat{transform-box:fill-box;transform-origin:50% 100%;animation:bob 5s ease-in-out infinite alternate}
@keyframes bob{from{transform:rotate(-1.2deg)}to{transform:rotate(1.3deg) translateY(3px)}}
.tent{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px;width:100%;align-items:stretch}
.hcard{padding:22px;position:relative;display:flex;flex-direction:column}
.hcard h2{font-size:18px;font-weight:800;margin-bottom:2px}
.hcard .sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
 border-radius:6px;padding:3px 8px;margin-bottom:10px;align-self:flex-start}
.badge.g{background:var(--green-pale);color:var(--green-dark)}
.badge.k{background:#EEF2F4;color:var(--ink)}
.hcard label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.hcard input,.hcard select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;outline:none}
.hcard input:focus{border-color:var(--ink)}
.hcard .btn{margin-top:auto}
.vstep{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:100%;margin-bottom:14px}
.vstep button{flex:none;width:44px;border:none;background:#fff;font-size:18px;font-weight:800;color:var(--ink);display:grid;place-items:center;transition:background .12s,color .12s}
.vstep button:hover{background:var(--green-pale);color:var(--green-dark)}
.vstep button:disabled{opacity:.3;pointer-events:none}
.vstep .vval{flex:1;display:grid;place-items:center;font-size:16px;font-weight:800;border-left:1px solid var(--line);border-right:1px solid var(--line);user-select:none}
.recent{margin-top:28px;width:100%}
.recent h3{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.recent .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.rcard{padding:14px 16px;display:flex;flex-direction:column;position:relative}
.rcard .rx{position:absolute;top:8px;right:8px;width:22px;height:22px;border:none;background:transparent;color:#8B93A0;font-size:16px;line-height:1;border-radius:6px;cursor:pointer;padding:0}
.rcard .rx:hover{background:#F1F3F5;color:#D64545}
.rcard .rx:focus{outline:2px solid var(--green);outline-offset:1px}
.rcard .rn{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:18px}
.rcard .rm{font-size:11.5px;color:var(--muted);margin:2px 0 10px}
.rcard .rm b{color:var(--green-dark);font-weight:700}
.rcard .btn{margin-top:auto;width:100%}
/* ---- header ---- */
.top{display:flex;align-items:center;gap:10px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);position:relative;flex-wrap:wrap}
.top .sep{width:1px;height:20px;background:var(--line)}
.top .sname{font-weight:700;font-size:14px;max-width:26vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.codechip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;letter-spacing:.12em;
 background:var(--green-pale);border-radius:8px;padding:4px 8px;color:var(--green-dark)}
.codechip button{border:none;background:none;padding:2px;color:var(--green-dark);display:inline-flex}
.codechip button:hover{color:var(--ink)}
.faci{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green-dark);
 background:var(--green-pale);padding:3px 8px;border-radius:6px}
.top .btn.icon{border-color:transparent}
.top .btn.icon:hover{border-color:var(--line)}
.dd{position:absolute;top:54px;right:18px;z-index:90;min-width:230px;background:#fff;border:1px solid var(--line);
 border-radius:12px;box-shadow:0 8px 28px rgba(40,46,58,.14);padding:6px}
.note.menuopen,.theme.menuopen{z-index:80}
.note.menuopen .ndots{display:inline-flex}
.dd .it{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:none;
 padding:9px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink)}
.dd .it:hover{background:var(--bg)}
.dd .it.danger{color:var(--pink)}
.dd .it .ck{width:16px;display:inline-flex;color:var(--green-dark)}
.dd hr{border:none;border-top:1px solid var(--line);margin:5px 8px}
/* ---- stepper ---- */
.steps{display:flex;align-items:center;gap:6px;padding:14px 20px 0;max-width:1240px;margin:0 auto;width:100%;overflow-x:auto}
.stp{display:inline-flex;align-items:center;gap:7px;border:none;background:none;padding:4px 8px;border-radius:8px;
 color:var(--soft);font-weight:600;font-size:12.5px;white-space:nowrap}
.stp .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:800;
 border:1.5px solid var(--line);background:#fff;flex:none}
.stp.cur{color:var(--ink)}
.stp.cur .n{background:var(--green);border-color:var(--green);color:#fff}
.stp.done{color:var(--ink)}
.stp.done .n{background:var(--green-pale);border-color:var(--green-pale);color:var(--green-dark)}
button.stp:hover{color:var(--green-dark)}
/* ---- bandeau de phase ---- */
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 90px;width:100%}
.phasebar{display:flex;align-items:center;gap:14px;background:var(--green-pale);border-radius:12px;padding:12px 16px;margin-top:12px;flex-wrap:wrap}
.phasebar .ic{width:34px;height:34px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none}
.phasebar .tt{min-width:0;flex:1}
.phasebar h3{font-size:15px;font-weight:800;line-height:1.2}
.phasebar p{font-size:12.5px;color:var(--muted);font-weight:500}
.phasebar .side{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none;max-width:100%}
.mini-sel{font-size:12px;color:var(--muted);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted);
 background:#fff;border-radius:8px;padding:4px 9px}
.pip{display:inline-block;width:8px;height:8px;border:1.5px solid var(--line);border-radius:50%}
.pip.f{background:var(--green);border-color:var(--green)}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.sg{display:inline-flex;align-items:center;gap:6px;border:none;background:transparent;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.sg:hover{color:var(--ink)}
.sg.on{background:var(--green);color:#fff}
.fchips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:520px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;
 padding:4px 11px 4px 5px;font-size:12px;font-weight:700;color:var(--muted);transition:all .12s}
.fchip:hover{border-color:var(--green)}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fchip .ava{width:20px;height:20px;font-size:9px}
.fnote{font-size:11px;color:var(--muted);font-weight:500;text-align:right}
/* ---- board ---- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:start;margin-top:16px}
.zone{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px rgba(40,46,58,.05)}
.zh{display:flex;gap:9px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);border-radius:11px 11px 0 0}
.zh .zic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.zh h3{font-size:14.5px;font-weight:800;line-height:1.15}
.zh p{font-size:11px;color:var(--muted);font-weight:500}
.cnt{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--soft)}
.cnt em{color:var(--pink);font-style:normal}
.addrow{padding:10px;border-bottom:1px solid var(--line);background:#FCFDFD}
.addrow .frow{display:flex;gap:8px}
.addta{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13px;background:#fff;outline:none;display:block;min-width:0}
.addta:focus{border-color:var(--green)}
.addgo{width:40px;height:38px;padding:0;border-radius:10px;flex:none}
.addgo:not(:disabled){background:var(--green);border-color:var(--green);color:#fff}
.addgo:not(:disabled):hover{background:var(--green-dark);border-color:var(--green-dark)}
.list{padding:10px;display:flex;flex-direction:column;gap:8px;border-radius:0 0 11px 11px}
/* ---- notes ---- */
.note{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px 8px;font-size:13px;box-shadow:0 1px 2px rgba(40,46,58,.05);word-break:break-word}
.note.click{cursor:pointer}
.note.click:hover{border-color:#C8D2D8}
.note.sel{background:var(--pink-pale);border-color:var(--pink)}
.note .ckmark{display:none;position:absolute;top:7px;right:8px;width:18px;height:18px;border-radius:50%;
 background:var(--pink);color:#fff;place-items:center;font-size:11px;font-weight:800}
.note.sel .ckmark{display:grid}
.nf{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:10.5px;color:var(--muted);font-weight:600}
.ava{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:8.5px;font-weight:800;color:#fff;flex:none}
.nvotes{font-weight:800;color:var(--green-dark);margin-left:auto}
.ndots{display:none;margin-left:auto;position:relative}
.note:hover .ndots,.note.menuopen .ndots{display:inline-flex}
.ndots>button{border:none;background:none;color:var(--soft);font-size:15px;letter-spacing:1px;padding:0 3px;line-height:1}
.ndots>button:hover{color:var(--ink)}
.note .dd{right:6px;top:34px;min-width:170px}
.hid{border:1px dashed var(--line);background:#FCFDFD;color:var(--muted);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:500}
.theme{border:1px solid var(--line);border-radius:12px;background:#fff;position:relative;margin-bottom:8px}
.theme .th{display:flex;align-items:center;gap:7px;padding:8px 10px;border-bottom:1px solid var(--line);border-radius:11px 11px 0 0}
.theme .th b{font-size:13px;font-weight:800;flex:1;min-width:0}
.theme .th .ndots{display:inline-flex}
.tn{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-radius:0 0 11px 11px}
.mini{border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:11px;flex:1 1 45%;display:flex;gap:5px;align-items:flex-start;background:#fff}
.mini button{border:none;background:none;color:var(--pink);font-size:11px;padding:0;line-height:1.3}
.empty{font-size:11px;color:var(--soft)}
/* ---- vote ---- */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:16px}
.vcard{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px rgba(40,46,58,.05);padding:14px;display:flex;flex-direction:column;gap:8px}
.vhead{display:flex;align-items:baseline;gap:8px}
.vhead b{font-size:14px;font-weight:800;flex:1;min-width:0}
.vhead span{font-size:11px;color:var(--soft);font-weight:600;white-space:nowrap}
.vlist{display:flex;flex-direction:column;gap:4px}
.vlist .vn{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted)}
.see{border:none;background:none;color:var(--green-dark);font-size:12px;font-weight:700;padding:0;text-align:left}
.see:hover{text-decoration:underline}
.vctrl{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:4px}
.vbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:16px;font-weight:700;display:grid;place-items:center;color:var(--ink)}
.vbtn:hover{border-color:var(--green);color:var(--green-dark)}
.vbtn:disabled{opacity:.3;pointer-events:none}
.vnum{font-size:20px;font-weight:800;min-width:26px;text-align:center}
.vsub{text-align:center;font-size:10.5px;color:var(--soft);font-weight:600}
/* ---- résultats ---- */
.results{max-width:640px;margin:26px auto 0;text-align:center}
.results .trophy{width:56px;height:56px;border-radius:16px;background:var(--green-pale);display:grid;place-items:center;margin:0 auto 12px;color:var(--green-dark)}
.results h2{font-size:24px;font-weight:800}
.results .sub{color:var(--muted);font-size:13.5px;font-weight:500;margin:4px 0 18px}
.rlist{text-align:left;display:flex;flex-direction:column;gap:10px}
.rrow{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.rrow .rank{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:#C4CDD4;flex:none}
.rrow.first .rank{background:var(--green)}
.rrow .rl{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .rv{font-weight:800;font-size:14px;white-space:nowrap}
.rrow .rv small{font-weight:600;color:var(--soft);font-size:11px}
.results .btn{margin-top:20px;width:100%}
/* ---- plan d'action ---- */
.acts{display:grid;grid-template-columns:minmax(260px,1fr) minmax(380px,2fr);gap:22px;margin-top:16px;align-items:start}
.sec h3{font-size:15px;font-weight:800}
.sec .ssub{font-size:12px;color:var(--muted);font-weight:500;margin:2px 0 10px}
.atabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.atab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--muted)}
.atab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.acard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.acard .r1{display:flex;align-items:center;gap:9px}
.acard input.t{flex:1;border:none;border-bottom:1px dashed var(--line);background:transparent;font-weight:700;font-size:14px;padding:3px 2px;outline:none;min-width:0}
.acard input.t:focus{border-bottom-color:var(--green)}
.acard .r2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.acard input.o{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;outline:none;background:#fff;min-width:0;flex:1}
.acard input.d{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;outline:none;background:#fff}
.segstat{display:inline-flex;background:#EEF2F4;border-radius:9px;padding:3px;gap:2px;flex:none}
.ss{border:none;background:transparent;border-radius:7px;padding:4px 9px;font-size:10.5px;font-weight:800;color:var(--muted);white-space:nowrap}
.ss:hover{color:var(--ink)}
.ss.on{box-shadow:0 1px 2px rgba(40,46,58,.15)}
.ss.on.st-todo{background:#fff;color:var(--ink)}
.ss.on.st-doing{background:var(--pink);color:#fff}
.ss.on.st-done{background:var(--green);color:#fff}
.ndots.big{display:inline-flex;position:relative}
/* ---- barre basse ---- */
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);
 display:flex;align-items:center;gap:12px;padding:9px 20px;flex-wrap:wrap}
.bbar .phn{font-weight:800;font-size:13.5px}
.bbar .sep{width:1px;height:22px;background:var(--line)}
#clock{font-weight:800;font-size:17px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums;border:none;background:none;padding:0;display:inline-flex;align-items:center;gap:4px;color:var(--ink)}
#clock .gear{opacity:.4}
#clock:hover .gear{opacity:.8}
#clock.zero{color:var(--pink);animation:clockpulse 1.1s ease-in-out infinite}
@keyframes clockpulse{0%,100%{opacity:1}50%{opacity:.5}}
.tstate{font-size:10.5px;color:var(--soft);font-weight:600}
.tpop{position:fixed;bottom:64px;left:16px;z-index:60;background:#fff;border:1px solid var(--line);border-radius:12px;
 box-shadow:0 8px 28px rgba(40,46,58,.14);padding:12px;display:flex;gap:9px;align-items:center}
.tpop select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff;outline:none}
.tpop .x{border:none;background:none;color:var(--soft);font-size:15px;padding:2px 4px;line-height:1}
.tpop .x:hover{color:var(--ink)}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:55;display:flex;gap:9px;align-items:center;
 background:var(--ink);color:#fff;border-radius:12px;padding:8px 14px;box-shadow:0 10px 26px rgba(40,46,58,.3);font-size:13px;font-weight:600;flex-wrap:wrap;justify-content:center}
.selbar .btn{border-color:transparent}
.selbar .btn.ghost{color:#fff}
/* ---- modale ---- */
.modal{position:fixed;inset:0;background:rgba(40,46,58,.42);display:grid;place-items:center;z-index:300;padding:16px}
.modal.hidden{display:none}
.mbox{width:min(460px,94vw);max-height:88vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(40,46,58,.3);padding:20px}
.mbox h3{font-size:17px;font-weight:800;margin-bottom:12px}
.mbox .lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.mbox input[type=text],.mbox input[type=number],.mbox textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;outline:none;background:#fff}

<script>
'use strict';

/* ============================ utilitaires ============================ */
function $(sel){ return document.querySelector(sel); }
function esc(t){
  return String(t === null || t === undefined ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function now(){ return Date.now(); }
function fmt(ms){
  var s = Math.max(0, Math.ceil(ms/1000));
  var m = Math.floor(s/60), r = s%60;
  return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;
}
function genCode(){
  var A='ABCDEFGHJKMNPQRSTUVWXYZ23456789', s='';
  for (var i=0;i<5;i++) s += A.charAt(Math.floor(Math.random()*A.length));
  return s;
}
function byId(arr,id){
  for (var i=0;i<arr.length;i++){ if (arr[i].id===id) return arr[i]; }
  return null;
}
function clone(o){
  var r={};
  for (var k in o){ if (Object.prototype.hasOwnProperty.call(o,k)) r[k]=o[k]; }
  return r;
}
function tronque(t,n){ t=String(t); return t.length>n ? t.slice(0,n-1)+'…' : t; }
function prenom(n){ return String(n||'').trim().split(/\s+/)[0]||'?'; }
function dateRel(at){
  if (!at) return '';
  var d=new Date(at), t=new Date(); t.setHours(0,0,0,0);
  var d0=new Date(d); d0.setHours(0,0,0,0);
  var diff=Math.round((t-d0)/86400000);
  if (diff===0) return 'Aujourd’hui';
  if (diff===1) return 'Hier';
  return d.toLocaleDateString('fr-FR');
}
function initials(n){
  return String(n||'').trim().split(/\s+/).map(function(w){return w.charAt(0);}).slice(0,2).join('').toUpperCase();
}
function toast(m,isAlert){
  var d=document.createElement('div');
  d.className='toast'+(isAlert?' alert':'');
  d.textContent=m;
  document.getElementById('toasts').appendChild(d);
  setTimeout(function(){ d.remove(); }, isAlert?6000:2600);
}
function showErr(e){
  var d=document.getElementById('err');
  d.style.display='block'; d.style.background='#FF0066';
  d.textContent='Erreur : '+(e&&e.message?e.message:String(e));
}
document.getElementById('err').addEventListener('click', function(){ this.style.display='none'; });

var audioCtx=null;
document.addEventListener('pointerdown', function(){
  if (!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; } }
  if (audioCtx && audioCtx.state==='suspended'){ try{ audioCtx.resume(); }catch(e){} }
});
function chime(){
  if (!audioCtx || audioCtx.state!=='running') return;
  try{
    var t=audioCtx.currentTime;
    [880,1174.7].forEach(function(f,i){
      var o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+i*0.16);
      g.gain.exponentialRampToValueAtTime(0.1,t+i*0.16+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.16+0.15);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t+i*0.16); o.stop(t+i*0.16+0.17);
    });
  }catch(e){}
}

function icoKraken(){

/* ============================ modales ============================ */
var modalOk=null;
function openModal(title, bodyHTML, opts){
  opts=opts||{};
  $('#m-title').textContent=title;
  $('#m-body').innerHTML=bodyHTML;
  var ok=$('#m-ok');
  ok.textContent=opts.okLabel||'Valider';
  ok.className='btn '+(opts.danger?'danger':'pri');
  $('#m-cancel').style.display=opts.hideCancel?'none':'';
  modalOk=opts.onOk||null;
  $('#modal').classList.remove('hidden');
  var f=$('#m-body input, #m-body textarea');
  if (f) setTimeout(function(){ f.focus(); },30);
}
function closeModal(){ $('#modal').classList.add('hidden'); modalOk=null; }
 $('#m-ok').addEventListener('click', function(){
  var cb=modalOk; modalOk=null;
  closeModal();
  if (cb) cb();
});
 $('#m-cancel').addEventListener('click', closeModal);
 $('#modal').addEventListener('click', function(e){ if (e.target.id==='modal') closeModal(); });
document.addEventListener('keydown', function(e){ if (e.key==='Escape') closeModal(); });

/* ============================ constantes ============================ */
var PID=['reflexion','revelation','groupement','vote','actions'];
var PHN={ reflexion:'Réflexion', revelation:'Révélation', groupement:'Regroupement', vote:'Vote', actions:'Plan d’action' };
var HINT={
  reflexion:'Chacun ajoute ses idées en silence. Les notes des autres restent masquées jusqu’à la révélation.',
  revelation:'Toutes les contributions sont maintenant visibles. Parcourez-les ensemble avant de les regrouper.',
  groupement:'Sélectionnez les notes qui parlent du même sujet, puis regroupez-les dans un thème.',
  vote:'Répartissez vos votes sur les sujets que vous jugez prioritaires.',
  actions:'Transformez les priorités retenues en actions concrètes, avec un responsable et une échéance.'
};
var ZONES=[
  { id:'objectif', nom:'Objectif', desc:'Où veut-on aller ?', c:'#30C5A7', pic:'palm' },
  { id:'vent', nom:'Vent', desc:'Ce qui nous aide', c:'#5E7A93', pic:'wind' },
  { id:'ancres', nom:'Ancres', desc:'Ce qui nous ralentit', c:'#282E3A', pic:'anchor' },
  { id:'recifs', nom:'Récifs', desc:'Les risques à anticiper', c:'#FF0066', pic:'reef' }
];
var COL=['#C7431F','#2F5D7C','#48704F','#7A4A72','#96622A','#3E6B6E'];
var BG =['#D9F5EE','#DCE6F4','#F6ECD2','#F6DEE9','#E4F2DC','#E2EFF2'];
var EDIT=['reflexion','revelation','groupement'];
var ANONBG='#E7ECEF';

function picto(name,color){
  var s='width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"';
  if (name==='palm') return '<svg '+s+'><path d="M11.5 22c.3-6 .8-10 1.8-13.5" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round"/><path d="M13.2 8.5C9.8 5 4.8 5.6 2.6 8.8c3.8-1 7.3-.6 10.6-.3zM13.6 8.3c.6-4.3 5-6.4 8.8-5-3.4.8-6.3 2.4-8.8 5zM13.4 8.7c4.3-2.3 8.6-.7 10.3 2.4-3.6-1.8-7.1-2-10.3-2.4z" fill="'+color+'"/></svg>';
  if (name==='wind') return '<svg '+s+' fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round"><path d="M3 8h9.5a2.4 2.4 0 1 0-2.4-2.4"/><path d="M3 13h14a2.4 2.4 0 1 1-2.4 2.4"/><path d="M3 18h7"/></svg>';
  if (name==='anchor') return '<svg '+s+' fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="2.2"/><path d="M12 7.2V21M8 10h8M4.5 13.5c.7 4.4 3.9 7.5 7.5 7.5s6.8-3.1 7.5-7.5"/></svg>';
  return '<svg '+s+'><path d="M2.5 20L10 6.5l4.2 7.4 2.8-4 4.5 10.1z" fill="'+color+'"/></svg>';
}
function avaHTML(s,author){
  if (!author) return '';
  if (author==='__anon') return '<span class="ava" style="background:'+ANONBG+';color:var(--muted)" title="Anonyme">?</span>';
  var p=byId(s.participants,author);
  if (!p) return '';
  return '<span class="ava" style="background:'+p.col+'" title="'+esc(p.name)+'">'+esc(initials(p.name))+'</span>';
}

/* ============================ état global ============================ */
var S=null, ME=null;
var sel=[];
var chan=null;
var anon=false;
var MYTAB=uid();
var sse=null;
var openMenu='';
var actFilter='all';
var openNotes={};
var timerPop=false;
var iaReady=false, iaModel='';
var ia={busy:false,tent:null,map:[],seq:0};

/* ============================ helpers d'état ============================ */
function score(s,id){
  var n=0;
  Object.keys(s.votes||{}).forEach(function(p){
    var v=s.votes[p]||{}; n+=(v[id]||0);
  });
  return n;
}
function budgetUsed(s,pid){
  var v=s.votes[pid]||{}; var n=0;
  Object.keys(v).forEach(function(k){ n+=v[k]; });
  return n;
}
function myVotesOn(s,pid,id){ var v=s.votes[pid]||{}; return v[id]||0; }
function totalVotes(s){
  var n=0;
  Object.keys(s.votes||{}).forEach(function(p){
    var v=s.votes[p]||{};
    Object.keys(v).forEach(function(k){ n+=v[k]; });
  });
  return n;
}
function allVoted(s){
  if (!s.participants.length) return false;
  for (var i=0;i<s.participants.length;i++){
    if (budgetUsed(s,s.participants[i].id)<s.voteBudget) return false;
  }
  return true;
}
function rankAll(s){
  var items=[];
  s.themes.forEach(function(t){ items.push({id:t.id,label:t.label,kind:'theme',created:t.created}); });
  s.notes.forEach(function(n){ items.push({id:n.id,label:n.text,kind:'note',created:n.created}); });
  items.sort(function(a,b){
    var d=score(s,b.id)-score(s,a.id);
    if (d!==0) return d;
    return a.created-b.created;
  });
  return items;
}
function visNotes(s,me){
  if (s.phase==='reflexion') return s.notes.filter(function(n){return n.author===me;});
  return s.notes;
}
/* Confidentialité : une note anonyme n'a pas d'auteur — elle n'appartient
   à aucun filtre par personne. Elle n'est visible que dans « Toute l'équipe »,
   puis participe anonymement aux thèmes, votes et actions. */
function passesFilter(n, viewFilter){
  if (!viewFilter) return true;
  return !n.an && n.author===viewFilter;
}
function isThemed(s,id){
  for (var i=0;i<s.themes.length;i++){
    if (s.themes[i].noteIds.indexOf(id)>=0) return true;
  }
  return false;
}
function themeNotes(s,t){
  var out=[];
  for (var i=0;i<t.noteIds.length;i++){
    var n=byId(s.notes,t.noteIds[i]);
    if (n) out.push(n);
  }
  return out;
}
function nameOf(s,id){ var p=byId(s.participants,id); return p?p.name:'?'; }
function ownerLabel(s,owner){
  if (!owner) return '';
  var p=byId(s.participants,owner);
  return p?p.name:owner;
}
function bgOf(s,n){
  if (n.an) return ANONBG;
  for (var i=0;i<s.participants.length;i++){
    if (s.participants[i].id===n.author) return BG[i%BG.length];
  }
  return ANONBG;
}
function colOf(s,id){
  var p=byId(s.participants,id);
  return p?p.col:'#5A6472';
}
function selHas(id){ return sel.indexOf(id)>=0; }
function showResults(){
  if (!S || S.phase!=='actions' || !S.votesRevealed) return false;
  try { return !sessionStorage.getItem('trav.res.'+S.code); } catch(e){ return true; }
}

/* ================== transitions d'état (pures) — INTACTES ================== */
var H={

  join: function(s,a,me){
    var exists=s.participants.some(function(p){return p.id===a.p.id;});
    if (exists) return s;
    var o=clone(s);
    o.participants=s.participants.concat([a.p]);
    o.rev=s.rev+1;
    return o;
  },

  rename_participant: function(s,a,me){
    if (me!==a.pid && me!==s.faci) return s;
    var name=(a.name||'').trim();
    if (!name) return s;
    if (s.participants.some(function(p){return p.id!==a.pid&&p.name===name;})) return s;
    var o=clone(s);
    o.participants=s.participants.map(function(p){
      if (p.id!==a.pid) return p;
      var np=clone(p); np.name=name; return np;
    });
    o.rev=s.rev+1;
    return o;
  },

  phase: function(s,a,me){
    if (me!==s.faci) return s;
    if (a.p===s.phase) return s;
    var o=clone(s);
    o.phase=a.p;
    o.viewFilter='';
    if (a.p==='vote'){ o.votesOpen=true; o.votesRevealed=false; }
    if (a.p==='actions'){ o.votesOpen=false; o.votesRevealed=true; }
    o.rev=s.rev+1;
    return o;
  },

  set_filter: function(s,a,me){
    if (me!==s.faci) return s;
    if ((s.viewFilter||'')===(a.pid||'')) return s;
    var o=clone(s);
    o.viewFilter=a.pid||'';
    o.rev=s.rev+1;
    return o;
  },

  add_note: function(s,a,me){
    if (s.phase!=='reflexion') return s;
    var text=a.text.trim();
    if (!text) return s;
    var n={id:uid(),zone:a.zone,text:text,author:me,an:!!a.an,created:now(),upd:now()};
    var o=clone(s);
    o.notes=s.notes.concat([n]);
    o.rev=s.rev+1;
    return o;
  },

  upd_note: function(s,a,me){
    if (EDIT.indexOf(s.phase)<0) return s;
    var n=byId(s.notes,a.id);
    if (!n) return s;
    if (n.author!==me && me!==s.faci) return s;
    var o=clone(s);
    o.notes=s.notes.map(function(x){
      if (x.id!==a.id) return x;
      var nx=clone(x);
      if (a.text!==undefined && a.text.trim()) nx.text=a.text.trim();
      if (a.an!==undefined) nx.an=a.an;
      nx.upd=now();
      return nx;
    });
    o.rev=s.rev+1;
    return o;
  },

  del_note: function(s,a,me){
    if (EDIT.indexOf(s.phase)<0) return s;
    var n=byId(s.notes,a.id);
    if (!n) return s;
    if (n.author!==me && me!==s.faci) return s;
    var o=clone(s);
    o.notes=s.notes.filter(function(x){return x.id!==a.id;});
    o.themes=s.themes
      .map(function(t){
        var nt=clone(t);
        nt.noteIds=t.noteIds.filter(function(id){return id!==a.id;});
        return nt;
      })
      .filter(function(t){return t.noteIds.length>0;});
    o.tomb=clone(s.tomb||{});
    o.tomb[a.id]=now();
    o.rev=s.rev+1;
    return o;
  },

  make_theme: function(s,a,me){
    if (s.phase!=='groupement') return s;
    var ids=a.ids.filter(function(i){return byId(s.notes,i);});
    if (ids.length<2) return s;
    var first=byId(s.notes,ids[0]);
    var fallback='Thème '+(s.themes.length+1);
    var label=(a.label||fallback).trim()||fallback;
    var t={id:uid(),zone:first.zone,label:label,noteIds:ids,created:now(),upd:now()};
    var o=clone(s);
    o.themes=s.themes.concat([t]);
    o.rev=s.rev+1;
    return o;
  },

  add_to_theme: function(s,a,me){
    if (s.phase!=='groupement') return s;
    var t=byId(s.themes,a.themeId);
    if (!t) return s;
    if (t.noteIds.indexOf(a.noteId)>=0) return s;
    var o=clone(s);
    o.themes=s.themes.map(function(x){
      var nx=clone(x);

  out_of_theme: function(s,a,me){

  del_theme: function(s,a,me){

  ren_theme: function(s,a,me){

  vote: function(s,a,me){
    if (s.phase!=='vote'||!s.votesOpen) return s;
    var isTheme=!!byId(s.themes,a.themeId);

    if (!isTheme && !isNote) return s;
    if (budgetUsed(s,a.pid)>=s.voteBudget) return s;
    var o=clone(s);
    var mine=clone(s.votes[a.pid]||{});
    mine[a.themeId]=(mine[a.themeId]||0)+1;
    o.votes=clone(s.votes);
    o.votes[a.pid]=mine;
    o.votesAt=clone(s.votesAt||{});

  unvote: function(s,a,me){

    if (mine[a.themeId]<=0) delete mine[a.themeId];
    var o=clone(s);
    o.votes=clone(s.votes);
    o.votes[a.pid]=mine;

function reduce(s,a,me){
  var h=H[a.k];
  if (!h) return s;
  return h(s,a,me);
}

/* Fusion convergente — INTACTE */
function merge(a,b){
  var base=(a.rev>=b.rev)?a:b;
  function union(A,B){
    var m={},order=[];
    function add(x){
      var cur=m[x.id];
      if (!cur){ m[x.id]=x; order.push(x.id); }
      else if ((x.upd||0)>(cur.upd||0)){ m[x.id]=x; }
    }
    A.forEach(add); B.forEach(add);
    return order.map(function(id){return m[id];});
  }
  var tomb=clone(a.tomb||{});
  Object.keys(b.tomb||{}).forEach(function(k){
    if (!(tomb[k]>0)||b.tomb[k]>tomb[k]) tomb[k]=b.tomb[k];
  });
  function alive(it){ return !tomb[it.id]; }
  var votes={},votesAt={},pids={};
  Object.keys(a.votes||{}).forEach(function(k){pids[k]=true;});
  Object.keys(b.votes||{}).forEach(function(k){pids[k]=true;});
  Object.keys(pids).forEach(function(pid){
    var ta=(a.votesAt&&a.votesAt[pid])||0;
    var tb=(b.votesAt&&b.votesAt[pid])||0;
    votes[pid]=(tb>ta)?clone(b.votes[pid]||{}):clone(a.votes[pid]||{});
    votesAt[pid]=Math.max(ta,tb);
  });
  var discussed=clone(a.discussed||{});
  Object.keys(b.discussed||{}).forEach(function(k){
    if (b.discussed[k]) discussed[k]=true;
  });
  var o=clone(base);
  o.rev=Math.max(a.rev||0,b.rev||0);
  o.participants=union(a.participants||[],b.participants||[]);
  o.notes=union(a.notes||[],b.notes||[]).filter(alive);
  o.themes=union(a.themes||[],b.themes||[]).filter(alive);
  o.actions=union(a.actions||[],b.actions||[]).filter(alive);
  o.votes=votes; o.votesAt=votesAt; o.tomb=tomb; o.discussed=discussed;
  o.viewFilter=base.viewFilter||'';
  if (!o.faci) o.faci=a.faci||b.faci||'';
  return o;
}

function newSession(code,name,creator,budget){
  return {
    code:code,name:name,rev:1,phase:'reflexion',faci:creator.id,
    participants:[creator],notes:[],themes:[],
    voteBudget:budget,votesOpen:false,votesRevealed:false,
    votes:{},votesAt:{},tomb:{},viewFilter:'',
    timer:{dur:300000,rem:300000,ends:0},
    discussed:{},actions:[],created:now()
  };
}

function migrate(s){
  if (!s) return s;
  if (!s.votesAt) s.votesAt={};
  if (!s.votes) s.votes={};
  if (!s.tomb) s.tomb={};
  if (s.viewFilter===undefined) s.viewFilter='';
  Object.keys(s.votes).forEach(function(pid){
    var v=s.votes[pid];
    if (Array.isArray(v)){
      var o={};
      v.forEach(function(t){ o[t]=(o[t]||0)+1; });
      s.votes[pid]=o;
      s.votesAt[pid]=1;
    }
  });
  if (s.phase==='discussion') s.phase='actions';
  (s.actions||[]).forEach(function(a){
    if (a&&a.owner){
      var p=byId(s.participants||[],a.owner);
      if (p) a.owner=p.name;
    }
  });
  var tomb=s.tomb;
  function alive(it){ return !tomb[it.id]; }
  s.notes=(s.notes||[]).filter(alive);
  s.themes=(s.themes||[]).filter(alive);
  s.actions=(s.actions||[]).filter(alive);
  return s;
}

/* ================== persistance + synchro — inchangées ================== */
function skey(c){ return 'trav.'+c; }
function idkey(c){ return 'trav.id.'+c; }
function save(){
  if (!S) return;
  try{
    localStorage.setItem(skey(S.code),JSON.stringify(S));
    var ix=[];
    try{ ix=JSON.parse(localStorage.getItem('trav.index')||'[]'); }catch(e){ ix=[]; }
    ix=ix.filter(function(x){return x.c!==S.code;});
    ix.unshift({c:S.code,n:S.name,r:(ME&&ME.id===S.faci)?'faci':'part',at:now()});
    localStorage.setItem('trav.index',JSON.stringify(ix.slice(0,8)));
  }catch(e){}
}
function listIndex(){
  try{ return JSON.parse(localStorage.getItem('trav.index')||'[]'); }catch(e){ return []; }
}
function indexRetire(c){
  try{
    localStorage.setItem('trav.index',JSON.stringify(listIndex().filter(function(x){return x.c!==c;})));
  }catch(e){}
}
function oublieLocale(c){
  /* Retire le raccourci et les traces locales d'une session (pas le serveur). */
  indexRetire(c);
  try{ localStorage.removeItem(skey(c)); }catch(e){}
  try{ localStorage.removeItem(idkey(c)); }catch(e){}
}
function goAccueil(code, msg){
  /* Retour accueil après suppression — même geste que « Quitter ». */
  S=null; ME=null; sel=[]; openMenu='';
  try{ sessionStorage.removeItem('trav.me'); }catch(e){}
  render();
  if (msg) toast(msg); else if (code) toast('Session '+code+' fermée');
}
function ejectionSuppression(code){
  /* La session a été supprimée sur le serveur (ou depuis un autre onglet) :
     nettoyer les traces locales et revenir à l'accueil. */
  if (!S) return;
  var c=code||S.code;
  oublieLocale(c);
  if (sse){ try{ sse.close(); }catch(e){} sse=null; }
  if (chan){ try{ chan.close(); }catch(e){} chan=null; }
  goAccueil(c,'Session '+c+' supprimée du serveur');
}
function loadS(c){
  try{
    var r=localStorage.getItem(skey(c));
    return r?migrate(JSON.parse(r)):null;
  }catch(e){ return null; }
}
function netActive(){
  return location.protocol==='http:'||location.protocol==='https:';
}
function connect(code){
  if (chan){ try{chan.close();}catch(e){} chan=null; }
  try{
    chan=new BroadcastChannel('trav-'+code);
    chan.onmessage=function(e){
      if (e.data&&e.data.k==='st') remote(e.data.s);
      else if (e.data&&e.data.k==='del') ejectionSuppression(e.data.code);
    };
  }catch(e){ chan=null; }
  window.onstorage=function(ev){
    if (ev.key===skey(code)&&ev.newValue){
      try{ remote(migrate(JSON.parse(ev.newValue))); }catch(e){}
    }
  };
  if (sse){ try{sse.close();}catch(e){} sse=null; }
  if (netActive()){
    try{
      sse=new EventSource('/flux?code='+encodeURIComponent(code));
      sse.onmessage=function(ev){
        try{
          var m=JSON.parse(ev.data);
          if (m.src===MYTAB) return;
          if (m.supprimee){ ejectionSuppression(m.codeSuppr||code); return; }
          if (m.state) remote(migrate(m.state));
        }catch(e){}
      };
    }catch(e){ sse=null; }
  }
  fetchIaStatus();
}
function fetchIaStatus(){
  if (!netActive()) return;
  try{
    fetch('/ia').then(function(r){ return r.ok?r.json():null; }).then(function(j){
      if (j&&typeof j.ready==='boolean'){ iaReady=!!j.ready; iaModel=j.model||''; render(); }
    }).catch(function(){});
  }catch(e){}
}
function send(){
  if (!S) return;
  if (chan){ try{ chan.postMessage({k:'st',s:S}); }catch(e){} }
  if (netActive()){
    try{
      fetch('/envoi',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({code:S.code,src:MYTAB,state:S})
      });
    }catch(e){}
  }
}
function remote(st){
  if (!S||!st||st.code!==S.code) return;
  var m=merge(S,st);
  S=m; save(); render();
}
function dispatch(a){
  if (!S||!ME) return;
  var n=reduce(S,a,ME.id);
  if (n===S) return;
  S=n; save(); send(); render();
}
function enter(){
  try{ sessionStorage.setItem('trav.me',JSON.stringify({code:S.code,pid:ME.id})); }catch(e){}
  try{ localStorage.setItem(idkey(S.code),JSON.stringify({pid:ME.id,name:ME.name,col:ME.col})); }catch(e){}
  save(); connect(S.code); send();
  sel=[]; openMenu=''; timerPop=false; lastRenderKey=null;
  render();
}

/* ================== rendu : protection de saisie + re-rendus groupés ================== */
var editDrafts={};
function captureEdits(){
  editDrafts={};
  var ae=document.activeElement;
  var fields=document.querySelectorAll('input[data-fld], textarea.addta, #m-body input, #m-body textarea');
  for (var i=0;i<fields.length;i++){
    var el=fields[i];
    if (!el.value) continue;
    var key=el.classList.contains('addta')
      ? 'addta:'+el.getAttribute('data-zone')
      : 'fld:'+(el.getAttribute('data-fld')||'m')+':'+(el.getAttribute('data-id')||el.name||el.id||i);
    editDrafts[key]={v:el.value,s:el.selectionStart,e:el.selectionEnd,foc:(el===ae)};
  }
}
function restoreEdits(){
  var toFocus=null;
  Object.keys(editDrafts).forEach(function(key){
    var el=null;
    if (key.indexOf('addta:')===0){
      el=document.querySelector('.addta[data-zone="'+key.slice(6)+'"]');
    } else {
      var rest=key.slice(4);
      var sep=rest.indexOf(':');
      var fld=rest.slice(0,sep), id=rest.slice(sep+1);
      el=document.querySelector('input[data-fld="'+fld+'"][data-id="'+id+'"]');
      if (!el) el=document.querySelector('#m-body');
    }
    if (!el) return;
    if (el.value!==editDrafts[key].v) el.value=editDrafts[key].v;
    if (editDrafts[key].foc){
      toFocus=el;
      try{ el.setSelectionRange(editDrafts[key].s,editDrafts[key].e); }catch(e){}
    }
  });
  if (toFocus) toFocus.focus();
  editDrafts={};
  /* Les boutons d'ajout reflètent toujours le contenu réel des champs. */
  var tas=document.querySelectorAll('.addta');
  for (var i=0;i<tas.length;i++){
    var b=document.querySelector('.addgo[data-zone="'+tas[i].getAttribute('data-zone')+'"]');
    if (b) b.disabled=!tas[i].value.trim();
  }
}
var renderQueued=false, lastRenderKey=null;
function render(){
  if (renderQueued) return;
  renderQueued=true;
  setTimeout(doRender,50);
}
function doRender(){
  renderQueued=false;
  captureEdits();
  var key;
  try{ key=JSON.stringify([S,anon,sel,openMenu,actFilter,openNotes,timerPop,ia.busy,iaReady]); }catch(e){ key=null; }
  if (key!==null && key===lastRenderKey){ restoreEdits(); return; }
  var html='';
  try{ html=(S&&ME)?sessionHTML():landingHTML(); }
  catch(e){ showErr(e); return; }
  var sy=window.pageYOffset;
  document.getElementById('app').innerHTML=html;
  try{ window.scrollTo(0,sy); }catch(e){}
  lastRenderKey=key;
  restoreEdits();
}

function stepperHTML(f){
  var cur=PID.indexOf(S.phase);
  var h='<nav class="steps">';
  PID.forEach(function(p,i){
    var cls='stp'+(i<cur?' done':'')+(i===cur?' cur':'');
    var n=i<cur?'✓':(i+1);
    if (f) h+='<button class="'+cls+'" data-act="phase" data-id="'+p+'"><span class="n">'+n+'</span>'+PHN[p]+'</button>';
    else h+='<span class="'+cls+'"><span class="n">'+n+'</span>'+PHN[p]+'</span>';
  });
  return h+'</nav>';
}

function phaseBarHTML(f){
  var p=S.phase, side='';
  var ic='<span class="ic">'+picto(p==='reflexion'?'palm':(p==='revelation'?'wind':(p==='groupement'?'anchor':(p==='vote'?'reef':'palm'))),'#1FA98C')+'</span>';
  if (p==='reflexion'){
    side='<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">'
      +'<span class="mini-sel">Mes notes</span>'
      +'<div class="seg">'
      +'<button class="sg'+(!anon?' on':'')+'" data-act="anonset" data-id="n" title="Notes nommées">'+icoUser()+' Nommées</button>'
      +'<button class="sg'+(anon?' on':'')+'" data-act="anonset" data-id="an" title="Notes anonymes">'+icoIncog()+' Anonymes</button>'
      +'</div></div>';
  }
  if (p==='revelation'){
    if (f){
      side='<div class="fchips">'
        +'<button class="fchip'+(!S.viewFilter?' on':'')+'" data-act="setfilter" data-id="">Toute l’équipe</button>'
        +S.participants.map(function(pp){
          return '<button class="fchip'+(S.viewFilter===pp.id?' on':'')+'" data-act="setfilter" data-id="'+pp.id+'" title="Afficher uniquement '+esc(pp.name)+'">'
            +avaHTML(S,pp.id)+esc(prenom(pp.name))+'</button>';
        }).join('')
        +'</div>'
        +(S.viewFilter?'<div class="fnote">Les notes anonymes n’apparaissent que dans « Toute l’équipe ».</div>':'');
    } else if (S.viewFilter){
      side='<div class="pill" style="color:var(--green-dark)">Affichage imposé : '+esc(nameOf(S,S.viewFilter))+'</div>';
    }
  }
  if (p==='vote'){
    var used=budgetUsed(S,ME.id);
    var pips='';
    for (var k=0;k<S.voteBudget;k++) pips+='<span class="pip'+(k<used?' f':'')+'"></span>';
    side='<div class="mini-sel" style="color:var(--ink);font-weight:800;font-size:13px">Votes restants : '+(S.voteBudget-used)+' / '+S.voteBudget+'</div>'
      +'<div class="pill">'+pips+' Résultats masqués jusqu’à la clôture</div>';
  }
  if (p==='groupement'&&f&&iaReady){
    var libres=iaLibres().length;
    side='<button class="btn dark sm" data-act="iasuggest"'+((ia.busy||libres<2)?' disabled':'')
      +' title="Proposer des regroupements à partir des '+libres+' note'+(libres>1?'s':'')+' libre'+(libres>1?'s':'')+'">'
      +icoKraken()+' '+(ia.busy?'Le Kraken réfléchit…':'Le Kraken suggère')+'</button>';
  }
  return '<div class="phasebar">'+ic+'<div class="tt"><h3>'+PHN[p]+'</h3><p>'+HINT[p]+'</p></div>'
    +(side?'<div class="side">'+side+'</div>':'')
    +'</div>'
    +(p==='vote'?voteProgressHTML(f):'');
}

function voteProgressHTML(f){
  var per=S.participants.map(function(pp){
    return avaHTML(S,pp.id)+' <b style="font-weight:700">'+esc(pp.name)+'</b> '+budgetUsed(S,pp.id)+'/'+S.voteBudget;
  }).join('<span style="opacity:.4;margin:0 6px">·</span>');
  var budget=f?' <button class="see" data-act="budget" style="margin-left:10px">Modifier les votes / personne</button>':'';
  return '<div style="font-size:12px;color:var(--muted);font-weight:600;margin-top:8px;display:flex;align-items:center;flex-wrap:wrap;gap:4px">'+per+budget+'</div>';
}

function sessionHTML(){
  var f=(ME.id===S.faci);
  var h=headerHTML(f);
  h+=stepperHTML(f);
  h+='<div class="wrap">';
  h+=phaseBarHTML(f);

  if (showResults()){
    h+=resultsHTML();
  } else if (S.phase==='actions'){
    h+=actionsView(f);
  } else if (S.phase==='vote'){
    h+=voteGridHTML();
  } else {
    h+='<div class="grid">';
    ZONES.forEach(function(z){ h+=zoneHTML(z,f); });
    h+='</div>';
  }
  h+='</div>';
  h+=bottomBarHTML(f);
  h+=selbarHTML(f);
  return h;
}

function zoneHTML(z,f){
  var all=S.notes.filter(function(n){return n.zone===z.id;});
  var phaseVis=(S.phase==='reflexion')?all.filter(function(n){return n.author===ME.id;}):all;
  var hid=all.length-phaseVis.length;
  var vis=phaseVis;
  if (S.phase==='revelation'&&S.viewFilter){
    vis=phaseVis.filter(function(n){return passesFilter(n,S.viewFilter);});
  }
  var canAdd=(S.phase==='reflexion');
  var showT=(S.phase==='groupement');
  var free=vis.filter(function(n){return !isThemed(S,n.id);});
  var zt=S.themes.filter(function(t){return t.zone===z.id;});

  var h='<section class="zone">';
  h+='<div class="zh"><span class="zic" style="background:'+z.c+'1A">'+picto(z.pic,z.c)+'</span>'
    +'<div><h3>'+z.nom+'</h3><p>'+z.desc+'</p></div>'
    +'<span class="cnt">'+vis.length+(hid?' <em>+'+hid+'</em>':'')+'</span></div>';
  if (canAdd){
    h+='<div class="addrow"><div class="frow"><textarea class="addta" rows="1" data-zone="'+z.id+'" placeholder="Ajouter une idée…"></textarea>'
      +'<button class="btn addgo" data-act="add" data-zone="'+z.id+'" disabled title="Ajouter l’idée">'+icoUp()+'</button></div></div>';
  }
  h+='<div class="list">';
  if (showT){
    zt.forEach(function(t){ h+=themeGroupHTML(t); });
  }
  free.forEach(function(n){ h+=noteHTML(n); });
  if (hid){
    h+='<div class="hid">'+hid+' contribution'+(hid>1?'s':'')+' masquée'+(hid>1?'s':'')+' — révélée'+(hid>1?'s':'')+' à l’étape suivante</div>';
  }
  h+='</div></section>';
  return h;
}

function themeGroupHTML(t){
  var ns=themeNotes(S,t);
  var h='<div class="theme'+(openMenu==='theme:'+t.id?' menuopen':'')+'"><div class="th"><b>'+esc(t.label)+'</b>'
    +'<span style="font-size:10.5px;color:var(--soft)">'+ns.length+' note'+(ns.length>1?'s':'')+'</span>'
    +'<span class="ndots big"><button data-act="menu" data-id="theme:'+t.id+'">•••</button></span>';
  if (openMenu==='theme:'+t.id){
    h+='<div class="dd" style="top:38px;right:6px;left:auto;bottom:auto;min-width:170px">'
      +'<button class="it" data-act="renth" data-id="'+t.id+'">Renommer</button>'
      +'<button class="it danger" data-act="delth" data-id="'+t.id+'">Supprimer</button></div>';
  }
  h+='</div><div class="tn">';
  ns.forEach(function(n){
    h+='<div class="mini"><span style="flex:1">'+esc(n.text)+'</span>'
      +'<button data-act="outn" data-id="'+n.id+'" title="Sortir du thème">✕</button></div>';
  });
  if (!ns.length) h+='<span class="empty">vide</span>';
  h+='</div></div>';
  return h;
}

function noteHTML(n){
  var clickable=(S.phase==='groupement')&&!isThemed(S,n.id);
  var cls='note'+(clickable?' click':'')+(selHas(n.id)?' sel':'')+(openMenu==='note:'+n.id?' menuopen':'');
  var au=n.an?avaHTML(S,'__anon')+' <span>Anonyme</span>':avaHTML(S,n.author)+' <span>'+esc(nameOf(S,n.author))+'</span>';
  var menu='';
  if ((n.author===ME.id||ME.id===S.faci)&&EDIT.indexOf(S.phase)>=0){
    menu='<span class="ndots"><button data-act="menu" data-id="note:'+n.id+'">•••</button>';
    if (openMenu==='note:'+n.id){
      menu+='<div class="dd">'
        +'<button class="it" data-act="editn" data-id="'+n.id+'">Modifier</button>'
        +'<button class="it" data-act="togglean" data-id="'+n.id+'">'+(n.an?'Nommer':'Anonymiser')+'</button>'
        +'<hr><button class="it danger" data-act="deln" data-id="'+n.id+'">Supprimer</button></div>';
    }
    menu+='</span>';
  }
  var badges='';
  if (S.votesRevealed){
    var sc=score(S,n.id);
    if (sc>0) badges='<span class="nvotes">'+sc+' vote'+(sc>1?'s':'')+'</span>';
  }
  return '<article class="'+cls+'" data-note="'+n.id+'">'
    +'<span class="ckmark">✓</span>'
    +'<div>'+esc(n.text)+'</div>'
    +'<div class="nf">'+au+badges+menu+'</div>'
    +'</article>';
}

/* ============================ vote ============================ */
function voteGridHTML(){
  var items=[];
  S.themes.forEach(function(t){ items.push({type:'theme',t:t}); });
  S.notes.forEach(function(n){ if (!isThemed(S,n.id)) items.push({type:'note',n:n}); });
  var h='<div class="vgrid">';
  items.forEach(function(it){
    var id=it.type==='theme'?it.t.id:it.n.id;
    var mine=myVotesOn(S,ME.id,id);
    var used=budgetUsed(S,ME.id);
    var canPlus=(S.votesOpen&&used<S.voteBudget);
    var canMinus=(S.votesOpen&&mine>0);
    h+='<div class="vcard">';
    if (it.type==='theme'){
      var ns=themeNotes(S,it.t);
      h+='<div class="vhead"><b>'+esc(it.t.label)+'</b><span>'+ns.length+' note'+(ns.length>1?'s':'')+'</span></div>';
      if (ns.length){
        var open=!!openNotes[id];
        h+='<div class="vlist">';
        ns.slice(0,open?ns.length:2).forEach(function(n){
          h+='<div class="vn">'+avaHTML(S,n.author)+'<span>'+esc(tronque(n.text,44))+'</span></div>';
        });
        h+='</div>';
        if (ns.length>2){
          h+='<button class="see" data-act="seetheme" data-id="'+id+'">'+(open?'Masquer':'Voir les '+ns.length+' notes')+'</button>';
        }
      }
    } else {
      h+='<div class="vhead"><b style="font-size:13.5px">'+esc(tronque(it.n.text,64))+'</b></div>'
        +'<div class="vn">'+avaHTML(S,it.n.author)+esc(nameOf(S,it.n.author))+'</div>';
    }
    h+='<div class="vctrl">'
      +'<button class="vbtn" data-act="unvote" data-id="'+id+'"'+(canMinus?'':' disabled')+'>−</button>'
      +'<span class="vnum">'+mine+'</span>'
      +'<button class="vbtn" data-act="vote" data-id="'+id+'"'+(canPlus?'':' disabled')+' style="'+(canPlus?'border-color:var(--green);color:var(--green-dark)':'')+'">+</button>'
      +'</div><div class="vsub">Mes votes</div>';
    h+='</div>';
  });
  h+='</div>';
  return h;
}

/* ============================ résultats ============================ */
function resultsHTML(){
  var ra=rankAll(S).filter(function(it){return score(S,it.id)>0;});
  var h='<div class="results">';
  h+='<div class="trophy"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4a2 2 0 0 0 2 4M17 6h3a2 2 0 0 1-2 4"/></svg></div>';
  h+='<h2>Priorités de l’équipe</h2>';
  h+='<p class="sub">Voici les sujets qui ont reçu le plus de votes.</p>';
  h+='<div class="rlist">';
  ra.forEach(function(it,i){
    h+='<div class="rrow'+(i===0?' first':'')+'"><span class="rank">'+(i+1)+'</span>'
      +'<span class="rl">'+esc(it.kind==='note'?tronque(it.label,54):it.label)+'</span>'
      +'<span class="rv">'+score(S,it.id)+' <small>vote'+(score(S,it.id)>1?'s':'')+'</small></span></div>';
  });
  if (!ra.length) h+='<p style="color:var(--muted);text-align:center">Aucun vote exprimé.</p>';
  h+='</div>';
  h+='<button class="btn pri" data-act="resultsdone">Construire le plan d’action →</button>';
  h+='</div>';
  return h;
}

/* ============================ plan d'action ============================ */
function actionsView(f){
  var h='<div class="acts">';
  h+='<div class="sec"><h3>Priorités</h3><p class="ssub">Issues du vote, du plus voté au moins voté.</p>';
  var ra=rankAll(S).filter(function(it){return score(S,it.id)>0;});

/* ============================ compte-rendu & export ============================ */
function markdown(s){
  var L=['# '+s.name+' — '+s.code,''];
  ZONES.forEach(function(z){
    L.push('## '+z.nom);
    var free=s.notes.filter(function(n){return n.zone===z.id&&!isThemed(s,n.id);});
    free.forEach(function(n){
      L.push('- '+n.text+' — '+(n.an?'Anonyme':nameOf(s,n.author))+' ('+score(s,n.id)+' vote(s))');
    });
    s.themes.filter(function(t){return t.zone===z.id;}).forEach(function(t){
      L.push('### '+t.label+' ('+score(s,t.id)+' vote(s))');
      themeNotes(s,t).forEach(function(n){
        L.push('- '+n.text+' — '+(n.an?'Anonyme':nameOf(s,n.author)));
      });
    });
  });
  L.push('## Actions');
  if (!s.actions.length) L.push('(aucune)');
  var ico={todo:'[ ]',doing:'[~]',done:'[x]'};
  s.actions.forEach(function(a){
    L.push('- '+ico[a.st]+' '+a.text+' — @'+(ownerLabel(s,a.owner)||'?')+(a.due?' (échéance '+a.due+')':''));
  });
  return L.join('\n');
}
function downloadMD(){
  try{
    var blob=new Blob([markdown(S)],{type:'text/markdown;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download='compte-rendu-'+S.code+'.md';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },2000);
    toast('Compte-rendu téléchargé');
  }catch(e){ showErr(e); }
}

function drawLogo(ctx,x,y,w){
  var sc=w/459.32;
  ctx.save(); ctx.translate(x,y); ctx.scale(sc,sc);
  ctx.fillStyle='#282E3A';
  LOGO_D.forEach(function(d){ ctx.fill(new Path2D(d)); });
  ctx.fill(new Path2D(LOGO_KTOP));
  ctx.fillStyle='#30C5A7';
  ctx.fill(new Path2D(LOGO_KLEG));
  ctx.restore();
}
function rrPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function wrapLines(ctx,text,maxW){
  var words=String(text).split(/\s+/);
  var lines=[],cur='';
  words.forEach(function(w){
    var t=cur?cur+' '+w:w;
    if (ctx.measureText(t).width>maxW&&cur){ lines.push(cur); cur=w; }
    else cur=t;
  });
  if (cur) lines.push(cur);
  return lines;
}

function copyText(t,ok){

/* ================== IA : le Kraken suggère (V2) ==================
   L'IA propose des tentacules {label, items:[indices]} ; l'acceptation
   passe par l'action reducer existante make_theme — l'état reste pur. */
function iaLibres(){
  return S.notes.filter(function(n){ return !isThemed(S,n.id); });
}
function iaSuggest(){
  if (!iaReady||ia.busy||!S) return;
  var libres=iaLibres();
  if (libres.length<2){ toast('Il faut au moins 2 notes libres'); return; }
  var seq=++ia.seq;
  ia.busy=true; render();
  toast('Le Kraken remonte les tentacules…');
  fetch('/ia',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({task:'themes',notes:libres.map(function(n,i){
      return {i:i,zone:n.zone,text:tronque(n.text,220)};
    })})
  }).then(function(r){ return r.json().catch(function(){ return {ok:false,error:'reponse-illisible'}; }); })
  .then(function(j){
    ia.busy=false;
    if (seq!==ia.seq){ render(); return; }
    if (j&&j.ok&&j.tentacules&&j.tentacules.length){
      ia.tent=j.tentacules.slice(0,6);
      ia.map=libres.map(function(n){ return n.id; });
      render();
      iaShow();
    } else {
      render();
      var MSG={ 'ia-non-configuree':'IA non configurée : renseignez IA_KEY dans votre environnement ou le fichier .env, puis redémarrez le serveur.',
                'delai-depasse':'Le Kraken a mis trop de temps à répondre — réessayez.',
                'clef-refusee':'Clef refusée par le service IA — vérifiez IA_KEY dans votre environnement ou le fichier .env, ainsi que l’offre de votre compte.',
                'quota-ia':'La clef est acceptée mais le quota du free tier est saturé — réessayez dans un instant, ou passez à Ollama (100 % local).',
                'modele-refuse':'Le modèle déclaré dans IA_MODEL est refusé par le service — vérifiez son identifiant auprès du fournisseur.',
                'service-indisponible':'Le serveur local a appelé le service IA, qui a répondu une erreur — lancez « node diagnostic-ia.mjs » pour un diagnostic précis.',
                'notes-insuffisantes':'Pas assez de notes exploitables.' };
      iaError(MSG[(j&&j.error)||'']||'Le Kraken n’a rien proposé — réessayez.',(j&&j.detail)||'');
    }
  }).catch(function(){
    ia.busy=false;
    if (seq===ia.seq) iaError('Serveur injoignable pour l’IA.');
    render();
  });
}
function iaShow(){
  var t=ia.tent||[];
  if (!t.length){ toast('Le Kraken n’a rien proposé'); return; }
  var cards=t.map(function(c,ci){
    var sn=c.items.slice(0,4).map(function(ix){
      var nid=ia.map[ix];
