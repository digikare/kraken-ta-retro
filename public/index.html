    if (c.items.length>4) sn+='<li style="font-style:italic">+ '+(c.items.length-4)+' autre(s)…</li>';
    return '<div class="iacard"><div style="flex:1;min-width:0"><div class="ilbl">'+esc(c.label)
      +' <span style="font-weight:600;color:var(--soft);font-size:11px">· '+c.items.length+' note'+(c.items.length>1?'s':'')+'</span></div>'
      +'<ul class="ianotes">'+sn+'</ul></div>'
      +'<button class="btn sm pri" data-act="iapick" data-id="'+ci+'">Créer</button></div>';
  }).join('');
  openModal('Le Kraken suggère '+t.length+' tentacule'+(t.length>1?'s':''),
    '<p style="font-size:12px;color:var(--muted);margin-top:-4px">Propositions à valider — créez-les telles quelles, ignorez-les, ou servez-vous-en comme point de départ.</p>'
    +'<div class="ialist">'+cards+'</div>'
    +'<div class="iafoot">Seuls les textes des notes (sans aucun nom d’auteur) ont été transmis au service d’IA configuré sur le serveur'
    +(iaModel?' ('+esc(iaModel)+')':'')+'.</div>',
    {okLabel:'Tout accepter', onOk:iaAcceptAll});
}
function iaAccept(ci){
  var c=(ia.tent||[])[ci];
  if (!c) return;
  var ids=c.items.map(function(ix){ return ia.map[ix]; })
    .filter(function(nid){ return nid&&byId(S.notes,nid)&&!isThemed(S,nid); });
  if (ids.length>=2){
    dispatch({k:'make_theme',ids:ids,label:c.label});
    toast('Thème créé : '+c.label);
  } else {
    toast('Plus assez de notes libres pour ce tentacule');
  }
  ia.tent.splice(ci,1);
  if (ia.tent.length) iaShow();
  else { ia.tent=null; closeModal(); }
}
function iaAcceptAll(){
  var cree=0;
  while ((ia.tent||[]).length){
    var c=ia.tent[0];
    var ids=c.items.map(function(ix){ return ia.map[ix]; })
      .filter(function(nid){ return nid&&byId(S.notes,nid)&&!isThemed(S,nid); });
    if (ids.length>=2){ dispatch({k:'make_theme',ids:ids,label:c.label}); cree++; }
    ia.tent.shift();
  }
  ia.tent=null;
  if (cree) toast(cree+' thème'+(cree>1?'s':'')+' créé'+(cree>1?'s':'')+' par le Kraken');
}
function iaError(msg,detail){
  openModal('Le Kraken a échoué','<div class="warn">'+esc(msg)+'</div>'
    +(detail?'<div style="margin-top:10px;font-size:11.5px;color:#5A6472;word-break:break-word">Détail technique : '+esc(String(detail).slice(0,200))+'</div>':''),{okLabel:'Fermer'});
}

/* ============================ interactions ============================ */
function finishJoin(jn,s,opts){
  s=migrate(s);
  var saved=null;
  try{ saved=JSON.parse(localStorage.getItem(idkey(s.code))||'null'); }catch(e){ saved=null; }
  var existing=(saved&&saved.pid)?byId(s.participants,saved.pid):null;
  if (!existing){
    for (var i=0;i<s.participants.length;i++){
      if (s.participants[i].name===jn){ existing=s.participants[i]; break; }
    }
  }
  if (existing){
    ME=existing;
    S=(jn&&jn!==existing.name)?reduce(s,{k:'rename_participant',pid:existing.id,name:jn},existing.id):s;
    toast('Bon retour, '+ME.name);
  } else {
    var nm=jn,n=2;
    while (s.participants.some(function(p){return p.name===nm;})){ nm=jn+' ('+(n++)+')'; }
    ME={id:uid(),name:nm,col:COL[(s.participants.length+1)%COL.length]};
    S=reduce(s,{k:'join',p:ME},ME.id);
    toast('Bienvenue à bord, '+ME.name);
  }
  /* Import d'une session dont le facilitateur d'origine est absent (fichier
     démo ou archivé) : l'importateur peut prendre la barre. Réglage local
     appliqué à l'état importé (rev++ pour gagner les fusions), reducer intact. */
  if (opts&&opts.faci&&S){ S=clone(S); S.faci=ME.id; S.rev=(S.rev||0)+1; toast('Vous avez pris la barre — rôle facilitateur'); }
  enter();
}
function resumeSession(code){
  var saved=null;
  try{ saved=JSON.parse(localStorage.getItem(idkey(code))||'null'); }catch(e){ saved=null; }
  var s=loadS(code);
  if (!s&&netActive()){
    toast('Recherche de la session…');
    fetch('/session/'+encodeURIComponent(code))
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(st){
        if (st&&st.code&&saved) finishJoin(saved.name,migrate(st));
        else { var jc=$('#j-code'); if (jc){ jc.value=code; $('#j-name').focus(); } }
      })
      .catch(function(){ var jc=$('#j-code'); if (jc){ jc.value=code; $('#j-name').focus(); } });
    return;
  }
  if (s&&saved){ finishJoin(saved.name,s); return; }
  if (s){
    var jc2=$('#j-code'); if (jc2){ jc2.value=code; $('#j-name').focus(); }
    return;
  }
  toast('Session '+code+' introuvable — le serveur doit être lancé.');
}

/* ====== suppression de session côté serveur ======
   DELETE /session/CODE : efface mémoire + disque et éjecte les équipages
   connectés (broadcast « supprimee » puis fermeture du flux SSE). Le code
   de session est le seul sésame — comme pour lire l'état : cohérent avec
   le modèle de confiance V1 (outil d'équipe, réseau de la salle). */
function supprimerSession(){
  if (!S||!ME){ return; }
  if (!netActive()){ toast('Suppression possible seulement avec le serveur lancé.'); return; }
  var code=S.code;
  fetch('/session/'+encodeURIComponent(code),{method:'DELETE'})
    .then(function(r){ return r.json().catch(function(){ return {ok:r.ok}; }); })
    .then(function(j){
      if (j&&j.ok){
        oublieLocale(code);
        if (chan){ try{ chan.postMessage({k:'del',code:code}); }catch(e){} }
        goAccueil(code,'Session '+code+' supprimée du serveur');
      } else if (j&&j.error==='session-inconnue'){
        oublieLocale(code);
        goAccueil(code,'Session déjà absente du serveur — traces locales nettoyées');
      } else {
        toast('Suppression refusée par le serveur.');
      }
    })
    .catch(function(){ toast('Serveur injoignable.'); });
}

/* ====== import / export de session (.json) ======
   L'état vit déjà sur le serveur (data/CODE.json) : l'export en est la
   porte de sortie, l'import la porte d'entrée — pratique pour tester
   sans saisir de vraies notes, archiver ou rejouer une rétro. */
function importFichier(file){
  if (!file) return;
  if (file.size>5*1024*1024){ toast('Fichier trop volumineux (max 5 Mo)'); return; }
  var fr=new FileReader();
  fr.onload=function(){ importerCorps(String(fr.result||'')); };
  fr.onerror=function(){ toast('Lecture du fichier impossible'); };
  fr.readAsText(file);
}
function importerCorps(txt){
  var st=null;
  try{ st=JSON.parse(txt); }catch(e){ toast('Fichier illisible — JSON attendu'); return; }
  var formeOk=st&&typeof st.code==='string'&&st.code.trim()
    &&Array.isArray(st.notes)&&Array.isArray(st.participants)&&st.participants.length>0;
  if (!formeOk){ toast('Ce fichier n’est pas une session La Traverse'); return; }
  if (st.notes.length===0){ toast('Session vide — ce fichier ne contient aucune note, rien à rejouer.'); return; }
  if (!netActive()){ toast('L’import nécessite le serveur — lancez npm start.'); return; }
  if (!Array.isArray(st.themes)) st.themes=[];
  if (!Array.isArray(st.actions)) st.actions=[];
  if (!st.discussed||typeof st.discussed!=='object') st.discussed={};
  if (!st.timer||typeof st.timer!=='object') st.timer={dur:300000,rem:300000,ends:0};
  if (typeof st.name!=='string'||!st.name.trim()) st.name='Rétrospective importée';
  if (!isFinite(st.rev)) st.rev=1;
  var pre=(($('#j-name')&&$('#j-name').value.trim())||localStorage.getItem('trav.lastname')||'');
  openModal('Importer cette session ?',
    '<p style="font-size:13.5px;color:var(--muted);margin:0 0 14px">« '+esc(st.name)+' » — '+st.notes.length+' note(s), '+st.participants.length+' participant(s), code <b>'+esc(String(st.code).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5))+'</b>.</p>'
    +'<label>Votre nom</label><input id="m-impname" value="'+esc(pre)+'" placeholder="Votre nom">'
    +'<label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;font-weight:600;color:var(--ink);margin-top:10px"><input type="checkbox" id="m-impfaci" checked> Prendre la barre (rôle facilitateur)</label>',
    {okLabel:'Embarquer',
     onOk:function(){
       var nm=(($('#m-impname')&&$('#m-impname').value.trim())||'').slice(0,40);
       if (!nm){ toast('Votre nom ?'); return; }
       localStorage.setItem('trav.lastname',nm);
       var barre=!!($('#m-impfaci')&&$('#m-impfaci').checked);
       toast('Import de la session…');
       fetch('/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(st)})
         .then(function(r){ return r.json().catch(function(){ return {ok:false}; }); })
         .then(function(j){
           if (j&&j.ok){ finishJoin(nm,st,{faci:barre}); }
           else if (j&&j.error==='code-deja-pris'){
             var cj=String(j.code||st.code).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);
             openModal('Code '+cj+' déjà pris sur ce serveur',
               '<p style="font-size:13.5px;color:var(--muted)">Les sessions survivent à l\'arrêt du serveur : elles sont enregistrées sur le disque (dossier <b>data/</b>). Un fichier portant ce code ne peut donc pas s\'importer tel quel.</p>'
               +'<p style="font-size:13.5px;color:var(--muted)">Vous pouvez <b>écraser</b> la session existante avec le contenu du fichier (les équipages connectés sur ce code seront éjectés), ou annuler et changer le « code » dans le fichier.</p>',
               {okLabel:'Écraser et importer', danger:true,
                onOk:function(){
                  toast('Écrasement de la session '+cj+'…');
                  fetch('/session/'+encodeURIComponent(cj),{method:'DELETE'})
                    .catch(function(){ return null; })
                    .then(function(){ return fetch('/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(st)}); })
                    .then(function(r){ return r.json().catch(function(){ return {ok:false}; }); })
                    .then(function(j2){
                      if (j2&&j2.ok){ finishJoin(nm,st,{faci:barre}); }
                      else { toast('Import refusé — fichier invalide ?'); }
                    })
                    .catch(function(){ toast('Serveur injoignable.'); });
                }});
           }
           else { toast('Import refusé — fichier invalide ?'); }
         })
         .catch(function(){ toast('Serveur injoignable.'); });
     }});
}

function doAct(act,id,st){
  if (act==='selftest'){ runTests(); return; }
  if (act==='vstep'){
    var el=$('#i-budget');
    if (!el) return;
    var cur=parseInt(el.textContent,10)||5;
    var nx=Math.min(10,Math.max(1,cur+parseInt(id,10)));
    el.textContent=nx;
    var btns=document.querySelectorAll('.vstep button');
    btns[0].disabled=(nx<=1);
    btns[1].disabled=(nx>=10);
    return;
  }
  if (act==='create'){
    var name=$('#i-name').value.trim().slice(0,40);
    if (!name){ toast('Votre nom ?'); return; }
    localStorage.setItem('trav.lastname',name);
    var budget=parseInt($('#i-budget').textContent,10)||5;
    budget=Math.min(10,Math.max(1,budget));
    var code=genCode();
    ME={id:uid(),name:name,col:COL[0]};
    S=newSession(code,$('#i-title').value.trim()||'Rétrospective sans nom',ME,budget);
    enter();
    toast('Session créée — '+code);
    return;
  }
  if (act==='join'){
    var jn=$('#j-name').value.trim().slice(0,40);
    var jc=$('#j-code').value.trim().toUpperCase();
    if (!jn||!jc){ toast('Nom et code requis'); return; }
    localStorage.setItem('trav.lastname',jn);
    var local=loadS(jc);
    if (local){ finishJoin(jn,local); return; }
    if (netActive()){
      toast('Recherche de la session…');
      fetch('/session/'+encodeURIComponent(jc))
        .then(function(r){ return r.ok?r.json():null; })
        .then(function(st2){
          if (st2&&st2.code) finishJoin(jn,st2);
          else toast('Session '+jc+' introuvable sur le serveur.');
        })
        .catch(function(){ toast('Serveur injoignable.'); });
      return;
    }
    toast('Session inconnue ici — ouvrez l’adresse du serveur.');
    return;
  }
  if (act==='resume'){ resumeSession(id); return; }
  if (act==='forget'){
    var ent=listIndex().filter(function(x){return x.c===id;})[0];
    openModal('Retirer « '+esc(ent?ent.n:id)+' » de la liste ?',
      '<p style="font-size:13.5px;color:var(--muted)">Ce raccourci local (et sa copie sur cet appareil) sera effacé. La session elle-même reste sur le serveur tant qu\'elle n\'y a pas été supprimée — les autres équipages ne sont pas touchés.</p>',
      {okLabel:'Retirer', danger:true,
       onOk:function(){
         oublieLocale(id);
         lastRenderKey=null; /* la clé de re-rendu ne couvre pas l'index local : forcer */
         render();
         toast('Carte retirée de la liste locale');
       }});
    return;
  }
  if (act==='importsession'){
    var inp=document.createElement('input');
    inp.type='file'; inp.accept='.json,application/json';
    inp.onchange=function(){ importFichier(inp.files&&inp.files[0]); };
    inp.style.display='none';document.body.appendChild(inp); inp.click();
    setTimeout(function(){ try{ inp.remove(); }catch(e){} },60000);
    return;
  }
  if (act==='delsession'){
    openMenu='';
    openModal('Supprimer la session du serveur ?',
      '<p style="font-size:13.5px;color:var(--muted)">« '+esc(S.name)+' » ('+esc(S.code)+') sera effacée du serveur — mémoire et disque — et tous les équipages connectés seront éjectés vers l\'accueil. Action irréversible : exportez le fichier .json avant, si vous voulez la rejouer.</p>',
      {okLabel:'Supprimer du serveur', danger:true, onOk:supprimerSession});
    return;
  }
  if (act==='quit'){
    openModal('Quitter la session ?','<p style="font-size:13.5px;color:var(--muted)">Vous pourrez reprendre votre profil via « Sessions récentes ».</p>',{
      okLabel:'Quitter', danger:true,
      onOk:function(){
        S=null; ME=null; sel=[]; openMenu='';
        try{ sessionStorage.removeItem('trav.me'); }catch(e){}
        render();
      }
    });
    return;
  }
  if (!S||!ME) return;

  if (act==='menu'){ openMenu=(openMenu===id)?'':id; render(); return; }
  if (act==='anonset'){
    anon=(id==='an');
    toast(anon?'Prochaines notes : anonymes':'Prochaines notes : nommées');
    render(); return;
  }
  if (act==='copycode'){ copyText(S.code,'Code copié'); openMenu=''; render(); return; }
  if (act==='share'){ copyText(location.href.split('?')[0]+'?session='+S.code,'Lien copié'); openMenu=''; return; }
  if (act==='dlmd'){ downloadMD(); openMenu=''; return; }
  if (act==='dlboard'){ exportBoardImage(); openMenu=''; return; }
  if (act==='dlsession'){
    openMenu='';
    if (!S) return;
    try{
      var blob=new Blob([JSON.stringify(S)],{type:'application/json'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='kraken-session-'+S.code+'.json';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); try{ a.remove(); }catch(e){} },400);
      toast('Session exportée — '+S.code);
    }catch(e){ toast('Export impossible dans ce navigateur'); }
    render(); return;
  }
  if (act==='phase'){ openMenu=''; dispatch({k:'phase',p:id}); return; }
  if (act==='go'){ dispatch({k:'phase',p:id}); return; }
  if (act==='setfilter'){ dispatch({k:'set_filter',pid:id||''}); return; }

  if (act==='add'){
    var ta=document.querySelector('.addta[data-zone="'+id+'"]');
    var v=ta?ta.value:'';
    if (v.trim()){
      ta.value='';
      var btn=document.querySelector('.addgo[data-zone="'+id+'"]');
      if (btn) btn.disabled=true;
      dispatch({k:'add_note',zone:id,text:v,an:anon});
    }
    return;
  }
  if (act==='editn'){
    openMenu='';
    var note=byId(S.notes,id);
    if (!note) return;
    openModal('Modifier la note',
      '<textarea id="m-ntext">'+esc(note.text)+'</textarea>'
      +'<label class="lbl" style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;font-weight:600;color:var(--ink)"><input type="checkbox" id="m-nanon"'+(note.an?' checked':'')+'> Note anonyme</label>',
      {okLabel:'Enregistrer',
       onOk:function(){
         var tx=$('#m-ntext').value;
         var an=$('#m-nanon').checked;
         if (!tx.trim()) dispatch({k:'del_note',id:id});
         else dispatch({k:'upd_note',id:id,text:tx,an:an});
       }});
    return;
  }
  if (act==='togglean'){
    openMenu='';
    var n2=byId(S.notes,id);
    if (n2) dispatch({k:'upd_note',id:id,an:!n2.an});
    return;
  }
  if (act==='deln'){
    openMenu='';
    dispatch({k:'del_note',id:id});
    toast('Note supprimée');
    return;
  }
  if (act==='renth'){
    openMenu='';
    var t=byId(S.themes,id);
    if (!t) return;
    openModal('Renommer le thème','<input type="text" id="m-ren" value="'+esc(t.label)+'">',{
      okLabel:'Renommer',
      onOk:function(){ dispatch({k:'ren_theme',id:id,label:$('#m-ren').value}); }
    });
    return;
  }
  if (act==='delth'){
    openMenu='';
    dispatch({k:'del_theme',id:id});
    toast('Thème supprimé');
    return;
  }
  if (act==='outn'){ dispatch({k:'out_of_theme',noteId:id}); return; }
  if (act==='mktheme'){
    var ids=sel.filter(function(nid){return !isThemed(S,nid);});
    if (ids.length<2){ toast('Sélectionnez au moins 2 notes'); return; }
    var notesH='<div class="notelist">'+ids.map(function(nid){
      var nn=byId(S.notes,nid);
      return nn?'<div class="nn">'+avaHTML(S,nn.author)+'<span>'+esc(nn.text)+'</span></div>':'';
    }).join('')+'</div>';
    openModal('Créer un thème',
      '<label class="lbl">Nom du thème</label><input type="text" id="m-theme" placeholder="Nom du thème">'
      +'<label class="lbl">Notes sélectionnées — '+ids.length+'</label>'+notesH,
      {okLabel:'Créer le thème',
       onOk:function(){
         var lab=$('#m-theme').value;
         dispatch({k:'make_theme',ids:ids,label:lab});
         sel=[];
         toast('Thème créé');
       }});
    return;
  }
  if (act==='addtotheme'){
    if (!S.themes.length){ toast('Aucun thème existant'); return; }
    var selNotes='<div class="notelist">'+sel.map(function(nid){
      var nn=byId(S.notes,nid);
      return nn?'<div class="nn">'+avaHTML(S,nn.author)+'<span>'+esc(nn.text)+'</span></div>':'';
    }).join('')+'</div>';
    openModal('Ajouter à un thème',
      '<label class="lbl">Notes sélectionnées — '+sel.length+'</label>'+selNotes
      +'<label class="lbl">Choisir un thème</label><div class="pick">'
      +S.themes.map(function(t){
        return '<button data-act="picktheme" data-id="'+t.id+'">'+esc(t.label)+' · '+themeNotes(S,t).length+' note(s)</button>';
      }).join('')+'</div>',
      {okLabel:'Fermer', hideCancel:true});
    return;
  }
  if (act==='picktheme'){
    for (var x=0;x<sel.length;x++){
      if (!isThemed(S,sel[x])) dispatch({k:'add_to_theme',themeId:id,noteId:sel[x]});
    }
    sel=[];
    toast('Notes ajoutées au thème');
    return;
  }
  if (act==='clearsel'){ sel=[]; render(); return; }
  if (act==='iasuggest'){ iaSuggest(); return; }
  if (act==='iapick'){ iaAccept(parseInt(id,10)); return; }

  if (act==='vote'){
    var used=budgetUsed(S,ME.id);
    if (used>=S.voteBudget){ toast('Plus de votes disponibles'); return; }
    var wasPhase=S.phase;
    dispatch({k:'vote',pid:ME.id,themeId:id});
    if (wasPhase==='vote'&&S.phase==='actions') toast('Tous les votes sont en — résultats révélés');
    return;
  }
  if (act==='unvote'){
    var wasP=S.phase;
    dispatch({k:'unvote',pid:ME.id,themeId:id});
    if (wasP==='vote'&&S.phase==='actions') toast('Tous les votes sont en — résultats révélés');
    return;
  }
  if (act==='seetheme'){
    openNotes[id]=!openNotes[id];
    render(); return;
  }
  if (act==='budget'){
    var tv=totalVotes(S);
    openModal('Modifier les votes par personne',
      '<input type="number" id="m-bud" min="1" max="10" value="'+S.voteBudget+'">'
      +(tv>0?'<div class="warn">'+tv+' vote(s) déjà posé(s) — appliquer remettra TOUS les votes à zéro.</div>':''),
      {okLabel:'Appliquer',
       onOk:function(){
         var b=parseInt($('#m-bud').value,10);
         if (!b||b===S.voteBudget) return;
         dispatch({k:'set_budget',n:b,resetVotes:tv>0});
         toast('Votes par personne : '+S.voteBudget);
       }});
    return;
  }
  if (act==='closevotes'){
    openModal('Clôturer le vote ?',
      '<p style="font-size:13.5px;color:var(--muted)">Les résultats seront révélés à tous et vous passerez au plan d’action.</p>',
      {okLabel:'Clôturer et afficher les résultats',
       onOk:function(){
         dispatch({k:'close_votes'});
         toast('Vote clôturé');
       }});
    return;
  }
  if (act==='resultsdone'){
    try{ sessionStorage.setItem('trav.res.'+S.code,'1'); }catch(e){}
    lastRenderKey=null; render(); return;
  }
  if (act==='actfilter'){ actFilter=id; render(); return; }
  if (act==='toact'){
    var t3=byId(S.themes,id);
    var n4=byId(S.notes,id);
    var label=t3?t3.label:(n4?n4.text:'');
    if (label){
      dispatch({k:'add_action',text:label,owner:'',due:''});
      toast('Action créée');
    }
    return;
  }
  if (act==='aadd'){
    dispatch({k:'add_action',text:'Nouvelle action',owner:'',due:''});
    toast('Action créée');
    return;
  }
  if (act==='setstatus'){
    dispatch({k:'upd_action',id:id,st:st});
    return;
  }
  if (act==='delactionask'){
    openModal('Supprimer cette action ?','<p style="font-size:13.5px;color:var(--muted)">Cette action sera définitivement retirée du plan.</p>',{
      okLabel:'Supprimer', danger:true,
      onOk:function(){ dispatch({k:'del_action',id:id}); toast('Action supprimée'); }
    });
    return;
  }
  if (act==='timerpop'){ timerPop=!timerPop; render(); return; }
  if (act==='tstart'){ dispatch({k:S.timer.ends?'timer_pause':'timer_start'}); return; }
  if (act==='treset'){ dispatch({k:'timer_reset'}); return; }
}

document.addEventListener('click', function(e){
  var el=e.target.closest?e.target.closest('[data-act]'):null;
  if (el){
    var a=el.getAttribute('data-act');
    if (a!=='menu'&&a!=='picktheme'&&a!=='timerpop'){ openMenu=''; }
    try{ doAct(a,el.getAttribute('data-id')||el.getAttribute('data-zone')||el.getAttribute('data-phase'),el.getAttribute('data-st')); }
    catch(err){ showErr(err); }
    return;
  }
  if (openMenu||timerPop){ openMenu=''; timerPop=false; render(); return; }
  if (S&&S.phase==='groupement'){
    var nEl=e.target.closest?e.target.closest('.note'):null;
    if (nEl&&!e.target.closest('.dd')){
      var nid=nEl.getAttribute('data-note');
      if (nid&&!isThemed(S,nid)){
        var i=sel.indexOf(nid);
        if (i>=0) sel.splice(i,1); else sel.push(nid);
        render();
      }
    }
  }
});

document.addEventListener('keydown', function(e){
  var t=e.target;
  if (t.getAttribute&&t.getAttribute('data-fld')==='text'&&e.key==='Enter'){
    e.preventDefault(); t.blur(); return;
  }
  if (e.key==='Enter'&&t.classList&&t.classList.contains('addta')&&!e.shiftKey){
    e.preventDefault();
    var v=t.value;
    if (v.trim()){
      t.value='';
      var btn=document.querySelector('.addgo[data-zone="'+t.getAttribute('data-zone')+'"]');
      if (btn) btn.disabled=true;
      dispatch({k:'add_note',zone:t.getAttribute('data-zone'),text:v,an:anon});
    }
  }
});

document.addEventListener('input', function(e){
  var t=e.target;
  if (t.classList&&t.classList.contains('addta')){
    var btn=document.querySelector('.addgo[data-zone="'+t.getAttribute('data-zone')+'"]');
    if (btn) btn.disabled=!t.value.trim();
  }
});

document.addEventListener('change', function(e){
  var t=e.target;
  if (!S) return;
  if (t.id==='t-dur'){
    dispatch({k:'timer_set',ms:parseInt(t.value,10)||300000});
    return;
  }
  var f2=t.getAttribute?t.getAttribute('data-fld'):null;
  if (f2==='text') dispatch({k:'upd_action',id:t.getAttribute('data-id'),text:t.value});
  if (f2==='owner') dispatch({k:'upd_action',id:t.getAttribute('data-id'),owner:t.value});
  if (f2==='due') dispatch({k:'upd_action',id:t.getAttribute('data-id'),due:t.value});
});

/* chrono : signal fort à zéro */
var clockDone=false;
setInterval(function(){
  if (!S) return;
  var c=document.getElementById('clock');
  if (!c) return;
  var running=!!S.timer.ends;
  var r=running?Math.max(0,S.timer.ends-now()):S.timer.rem;
  var txt=fmt(r)+' '+icoGear();
  if (c.innerHTML!==txt) c.innerHTML=txt;
  c.classList.toggle('zero',running&&r===0);
  var ts=document.querySelector('.tstate');
  if (running&&r===0){
    if (ts) ts.textContent='temps écoulé';
    if (!clockDone){ clockDone=true; toast('Temps écoulé',true); chime(); }
  } else {
    if (ts) ts.textContent=running?'en cours':'en pause';
    if (!running) clockDone=false;
  }
},250);

/* ================== auto-test (15 vérifications — via ?tests=1 ou bouton accueil) ================== */
function runTests(){
  var out=[];
  function T(name,fn){
    try{ fn(); out.push('✓ '+name); }
    catch(e){ out.push('✕ '+name+' — '+(e.message||e)); }
  }
  function ok(c,m){ if (!c) throw new Error(m||'échec'); }
  function bs(){ return newSession('T','T',{id:'p1',name:'A',col:COL[0]},3); }

  T('Réflexion masquée', function(){
    var s=reduce(bs(),{k:'add_note',zone:'vent',text:'a'},'p1');
    s=reduce(s,{k:'add_note',zone:'vent',text:'b'},'p2');
    ok(visNotes(s,'p1').length===1);
    ok(s.notes.length===2);
  });
  T('Saisie de notes limitée à la Réflexion', function(){
    var s=bs(); s.phase='groupement';
    ok(reduce(s,{k:'add_note',zone:'vent',text:'trop tard'},'p1').notes.length===0);
  });
  T('Seul le facilitateur change de phase', function(){
    ok(reduce(bs(),{k:'phase',p:'revelation'},'p2').phase==='reflexion');
    ok(reduce(bs(),{k:'phase',p:'revelation'},'p1').phase==='revelation');
  });
  T('Regroupement en thème', function(){
    var s=bs(); s.phase='groupement';
    s.notes=[{id:'n1',zone:'vent',text:'x',author:'p1',an:false,created:1,upd:1},
             {id:'n2',zone:'vent',text:'y',author:'p2',an:false,created:1,upd:1}];
    s=reduce(s,{k:'make_theme',ids:['n1','n2'],label:'Essai'},'p1');
    ok(s.themes.length===1&&s.themes[0].noteIds.length===2);
  });
  T('Budget de votes, sans plafond par cible', function(){
    var s=bs(); s.phase='vote'; s.votesOpen=true;
    s.themes=[{id:'t1',zone:'vent',label:'A',noteIds:[],created:1,upd:1}];
    for (var i=0;i<4;i++) s=reduce(s,{k:'vote',pid:'p1',themeId:'t1'},'p1');
    ok(score(s,'t1')===3);
  });
  T('Vote sur une note libre', function(){
    var s=reduce(bs(),{k:'add_note',zone:'vent',text:'idée isolée'},'p1');
    var noteId=s.notes[0].id;
    s=reduce(s,{k:'phase',p:'vote'},'p1');
    s=reduce(s,{k:'vote',pid:'p2',themeId:noteId},'p2');
    ok(score(s,noteId)===1);
  });
  T('Clôture révèle et passe en Plan d’action', function(){
    var s=bs(); s.phase='vote'; s.votesOpen=true;
    s.participants.push({id:'p2',name:'L',col:COL[1]});
    s.themes=[{id:'t1',zone:'vent',label:'A',noteIds:[],created:1,upd:1},
              {id:'t2',zone:'vent',label:'B',noteIds:[],created:2,upd:2}];
    s=reduce(s,{k:'vote',pid:'p1',themeId:'t1'},'p1');
    s=reduce(s,{k:'vote',pid:'p2',themeId:'t1'},'p2');
    ok(!s.votesRevealed&&s.phase==='vote');
    s=reduce(s,{k:'close_votes'},'p1');
    ok(s.votesRevealed&&s.phase==='actions'&&rankAll(s)[0].id==='t1');
  });
  T('Auto-clôture quand tous ont épuisé leur budget', function(){
    var s=bs(); s.phase='vote'; s.votesOpen=true;
    s.themes=[{id:'t1',zone:'vent',label:'A',noteIds:[],created:1,upd:1}];
    s=reduce(s,{k:'vote',pid:'p1',themeId:'t1'},'p1');
    ok(s.phase==='vote');
    s=reduce(s,{k:'vote',pid:'p1',themeId:'t1'},'p1');
    s=reduce(s,{k:'vote',pid:'p1',themeId:'t1'},'p1');
    ok(s.phase==='actions'&&s.votesRevealed&&score(s,'t1')===3);
    var s2=bs(); s2.phase='vote'; s2.votesOpen=true;
    s2.participants.push({id:'p2',name:'L',col:COL[1]});
    s2.themes=[{id:'t1',zone:'vent',label:'A',noteIds:[],created:1,upd:1}];
    for (var i=0;i<3;i++) s2=reduce(s2,{k:'vote',pid:'p1',themeId:'t1'},'p1');
    ok(s2.phase==='vote');
  });
  T('Nb de votes : libre avant tout vote, sinon remise à zéro explicite', function(){
    var s=bs(); s.phase='vote'; s.votesOpen=true;
    s.themes=[{id:'t1',zone:'vent',label:'A',noteIds:[],created:1,upd:1}];
    s=reduce(s,{k:'set_budget',n:5},'p1');
    ok(s.voteBudget===5);
    for (var i=0;i<3;i++) s=reduce(s,{k:'vote',pid:'p1',themeId:'t1'},'p1');
    ok(reduce(s,{k:'set_budget',n:7},'p1').voteBudget===5);
    ok(reduce(s,{k:'set_budget',n:9,resetVotes:true},'pX').voteBudget===5);
    var s7=reduce(s,{k:'set_budget',n:7,resetVotes:true},'p1');
    ok(s7.voteBudget===7&&score(s7,'t1')===0&&s7.phase==='vote');
    for (var j=0;j<7;j++) s7=reduce(s7,{k:'vote',pid:'p1',themeId:'t1'},'p1');
    ok(s7.phase==='actions'&&score(s7,'t1')===7);
  });
  T('Votes simultanés de deux navigateurs conservés', function(){
    var a=bs(); a.phase='vote'; a.votesOpen=true;
    a.themes=[{id:'t1',zone:'vent',label:'A',noteIds:[],created:1,upd:1},
              {id:'t2',zone:'vent',label:'B',noteIds:[],created:2,upd:2}];
    var b=clone(a);
    for (var i=0;i<3;i++) a=reduce(a,{k:'vote',pid:'p1',themeId:'t1'},'p1');
    for (var j=0;j<3;j++) b=reduce(b,{k:'vote',pid:'p2',themeId:'t2'},'p2');
    var m=merge(a,b);
    ok(score(m,'t1')===3&&score(m,'t2')===3);
  });
  T('Suppression conservée après fusion (tombstone)', function(){
    var s=reduce(bs(),{k:'add_note',zone:'vent',text:'à supprimer'},'p1');
    var nid=s.notes[0].id;
    var b=clone(s);
    s=reduce(s,{k:'del_note',id:nid},'p1');
    ok(byId(merge(s,b).notes,nid)===null);
    ok(byId(merge(b,s).notes,nid)===null);
  });
  T('Action supprimable par le facilitateur uniquement', function(){
    var s=reduce(bs(),{k:'phase',p:'actions'},'p1');
    s=reduce(s,{k:'add_action',text:'Faire ceci',owner:'',due:''},'p1');
    var aid=s.actions[0].id;
    ok(reduce(s,{k:'del_action',id:aid},'p2').actions.length===1);
    ok(reduce(s,{k:'del_action',id:aid},'p1').actions.length===0);
  });
  T('Un nom trop long est borné à 40 caractères', function(){
    var long=new Array(121).join('x');
    ok(long.length===120);
    var jn=long.trim().slice(0,40);
    ok(jn.length===40);
    var s=bs();
    var s2=reduce(s,{k:'rename_participant',pid:'p1',name:'   '},'p1');
    ok(s2.participants[0].name==='A');
  });
  T('Un budget hors bornes est encadré entre 1 et 10', function(){
    var s=bs();
    ok(reduce(s,{k:'set_budget',n:99,resetVotes:true},'p1').voteBudget===10);
    ok(reduce(s,{k:'set_budget',n:-3,resetVotes:true},'p1').voteBudget===1);
    ok(reduce(s,{k:'set_budget',n:0,resetVotes:true},'p1').voteBudget===3);
  });
  T('Anonymes : visibles en équipe, jamais attribuables à un filtre', function(){
    var s=reduce(bs(),{k:'add_note',zone:'vent',text:'a'},'p1');
    s=reduce(s,{k:'add_note',zone:'vent',text:'b',an:true},'p2');
    s=reduce(s,{k:'phase',p:'revelation'},'p1');
    /* « Toute l'équipe » : tout est visible, y compris l'anonyme */
    var all=s.notes.filter(function(n){return passesFilter(n,'');});
    ok(all.length===2, 'Toute l’équipe doit inclure les anonymes');
    /* filtre par p1 : uniquement la note nommée de p1, jamais l'anonyme */
    var vis=s.notes.filter(function(n){return passesFilter(n,'p1');});
    ok(vis.length===1&&vis[0].author==='p1', 'le filtre ne doit contenir que les notes nommées de p1');
    ok(passesFilter({id:'x',an:true,author:'p2'},'p1')===false, 'une anonyme n’est jamais attribuable');
  });

  var allOk=true;
  out.forEach(function(l){ if (l.charAt(0)!=='✓') allOk=false; });
  var d=document.getElementById('err');
  d.style.display='block';
  d.style.background=allOk?'#30C5A7':'#FF0066';
  d.textContent=out.join('   ·   ');
  if (allOk) setTimeout(function(){ d.style.display='none'; },8000);
}

/* ============================ démarrage ============================ */
(function boot(){
  try{
    var m=JSON.parse(sessionStorage.getItem('trav.me')||'null');
    if (m){
      var s=loadS(m.code);
      var p=s?byId(s.participants,m.pid):null;
      if (s&&p){ S=s; ME=p; connect(s.code); }
      else { try{ sessionStorage.removeItem('trav.me'); }catch(e){} }
    }
  }catch(e){}
  render();
  if (new URLSearchParams(location.search).get('tests')) runTests();
  window.__krakenOK=true;
})();
</script>
